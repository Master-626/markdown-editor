[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-editor"
version = "0.1.0"
description = "Terminal Markdown toolkit for preview, HTML export, search, and writing statistics"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["markdown", "editor", "cli", "writing", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "markdown>=3.5",
    "pygments>=2.15.0",
]

[project.scripts]
mdedit = "markdown_editor.cli:main"
markdown-editor = "markdown_editor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.urls]
Homepage = "https://github.com/Master-626/markdown-editor"
Repository = "https://github.com/Master-626/markdown-editor"
Issue-Tracker = "https://github.com/Master-626/markdown-editor/issues"
